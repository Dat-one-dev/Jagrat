<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jagrat</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="browsertabs">
        <div class="tabs">
            <span class="tabIcn" = "">
                ॐ
            </span>
            <span class="tabTitle" = "">
                New Tab
            </span>
            <span class="tabX" = "">
                X
            </span>
        </div>
    </div>
    <div class="mainapp">
        <aside class="sidebar">
        </aside>
        <main class="center">
            <section class="hero">
                <div class="tuffskt">
                    उत्तिष्ठ जाग्रत प्राप्य वरान्निबोधत
                </div>
                <div class="quote" id="quote">
                    Arise, awake, and learn by approaching the wise.
                </div>
                <div class="clock">
                    <span id="clock"></span>
                    <span id="ampm"></span>
                </div>

                <div class="date" id="date"></div>
                <div class="searchPanel">
                    <input id="search" type="text" placeholder="Discover the bhrman..." autocomplete="off">
                    <button id="searchButt">S</button>
                </div>
                <div class="search-engines">
                    <button data-engine="google">G</button>
                    <button data-engine="ddg">D</button>
                    <button data-engine="wiki">W</button>
                </div>
            </section>
            <section class="bottom">
                <div class="sanskrit">
                    सर्वे भवन्तु सुखिनः
                </div>
                <div>
                    MAY ALL BEINGS BE HAPPY
                </div>
            </section>
            <section class="music">
                <div class="music-info">
                    <div class="music-cover">
                        <img src="assets/music-cover.png" alt="Music cover">
                    </div>

                    <div class="music-text">
                        <div class="music-title">A Modern Mantra</div>
                        <div class="music-artist"> Govinda</div>
                    </div>
                </div>

                <div class="music-line"></div>

                <div class="music-controls">
                    <button><</button>
                    <button class="play" id="playButton"><></button>
                    <button>></button>
                </div>
                <audio id="music" src="assets/Stillness_at_First_Light.mp3"></audio>
            </section>
        </main>
        <aside class="rightbar">
            <section class="weather">
                <h3>WEATHER</h3>

                <div class="weather-temp" id="weather-temp">
                    --°C
                </div>

                <div class="weather-place" id="weather-place">
                    Loading...
                </div>

                <div class="weather-status" id="weather-status">
                    --
                </div>
            </section>
        </aside>
    </div>
</body>
</html>
