<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jagrat</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="browsertabs">
        <div class="tabs">
            <span class="tabIcn" = "">
                ॐ
            </span>
            <span class="tabTitle" = "">
                New Tab
            </span>
            <span class="tabX" = "">
                X
            </span>
        </div>
    </div>
    <div class="mainapp">
        <aside class="sidebar">
        </aside>
        <main class="center">
            <section class="hero">
                <div class="tuffskt">
                    उत्तिष्ठ जाग्रत प्राप्य वरान्निबोधत
                </div>
                <div class="quote" id="quote">
                    ARISE, AWAKE AND STOP NOT TILL THE GOAL IS REACHED.
                </div>
                <div class="clock">
                    <span id="clock"></span>
                    <span id="ampm"></span>
                </div>

                <div class="date" id="date"></div>
                <div class="searchPanel">
                    <input id="search" type="text" placeholder="Discover the bhrman..." autocomplete="off">
                    <button id="searchButt">S</button>
                </div>
                <div class="search-engines">
                    <button data-engine="google">G</button>
                    <button data-engine="ddg">D</button>
                    <button data-engine="wiki">W</button>
                </div>
            </section>
            <section class="bottom">
                <div class="sanskrit">
                    सर्वे भवन्तु सुखिनः
                </div>
                <div>
                    MAY ALL BEINGS BE HAPPY
                </div>
            </section>

        </main>
        <aside class="rightbar">
        </aside>
    </div>
</body>
</html>
